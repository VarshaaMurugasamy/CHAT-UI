<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aesthetic Chat UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center 
bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

  <!-- Chat Container -->
  <div class="w-full max-w-md h-[600px] bg-white/20 backdrop-blur-lg 
  rounded-3xl shadow-2xl flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="p-4 bg-white/30 flex items-center gap-3">
      <img src="dora 2.jpg" class="w-10 h-10 rounded-full">
      <div>
        <h2 class="text-white font-semibold">Dora</h2>
        <p class="text-xs text-white/70">online</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 p-4 space-y-4 overflow-y-auto">

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img src="dora 2.jpg" class="w-8 h-8 rounded-full">
        <div class="bg-white/80 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[75%]">
          Heyy Bujji 👋
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end items-start gap-2">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 
        text-white p-3 rounded-2xl rounded-tr-none max-w-[75%]">
          Hi Dora
        </div>
        <img src="bujji.webp" class="w-8 h-8 rounded-full">
      </div>

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img src="dora 2.jpg" class="w-8 h-8 rounded-full">
        <div class="bg-white/80 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[75%]">
          How are u ??
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end items-start gap-2">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 
        text-white p-3 rounded-2xl rounded-tr-none max-w-[75%]">
          I'm good, just working on a project 😎
        </div>
        <img src="bujji.webp" class="w-8 h-8 rounded-full">
      </div>

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img src="dora 2.jpg" class="w-8 h-8 rounded-full">
        <div class="bg-white/80 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[75%]">
          That's awesome! What project?
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end items-start gap-2">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 
        text-white p-3 rounded-2xl rounded-tr-none max-w-[75%]">
          A chat UI like this one 😊
        </div>
        <img src="bujji.webp" class="w-8 h-8 rounded-full">
      </div>

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img src="dora 2.jpg" class="w-8 h-8 rounded-full">
        <div class="bg-white/80 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[75%]">
          Wow, looks amazing! 🎨
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end items-start gap-2">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 
        text-white p-3 rounded-2xl rounded-tr-none max-w-[75%]">
          Thanks! Still tweaking the styles 😅
        </div>
        <img src="bujji.webp" class="w-8 h-8 rounded-full">
      </div>

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img src="dora 2.jpg" class="w-8 h-8 rounded-full">
        <div class="bg-white/80 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[75%]">
          Can't wait to see the final result! 🌟
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end items-start gap-2">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 
        text-white p-3 rounded-2xl rounded-tr-none max-w-[75%]">
          I'll share it with you soon 😉
        </div>
        <img src="bujji.webp" class="w-8 h-8 rounded-full">
      </div>

    </div>

    <!-- Input -->
    <div class="p-4 bg-white/30 flex items-center gap-3">
      <input type="text" placeholder="Type a message..."
        class="flex-1 px-4 py-2 rounded-full 
        bg-white/70 focus:outline-none focus:ring-2 focus:ring-pink-400">
      <button class="px-5 py-2 rounded-full text-white font-semibold
        bg-gradient-to-r from-pink-500 to-purple-500 hover:scale-105 transition">
        Send
      </button>
    </div>

  </div>

</body>
</html>
